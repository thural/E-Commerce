<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Shopping Home</title>
</head>
<body>
<div class="container">
    <div sec:authorize="isAuthenticated()">
        <h1>welcome back ${username}</h1>
        <form action="/logout" method="post">
            <input th:name="${_csrf.parameterName}" th:value="${_csrf.token}" type="hidden">
            <button type="submit">logout</button>
        </form>
    </div>
    <div sec:authorize="!isAuthenticated()">
        <strong>you have not signed in</strong>
        <button class="button primary" onclick="window.location.href='/login';">login</button>
        <button class="button primary" onclick="window.location.href='/register';">register</button>
        <button class="button primary" data-bs-dismiss="alert">close</button>
    </div>
    <button class="button primary" onclick="window.location.href='/products';">products</button>
</div>
</body>
</html>
