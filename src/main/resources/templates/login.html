<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<div class="login-container">
    <!-- Spring Security Error Message -->
    <div class="error-message" th:if="${param.error}">
        <p>Invalid username or password. Please try again.</p>
    </div>

    <!-- Logout Success Message -->
    <div class="success-message" th:if="${param.logout}">
        <p>You have been logged out successfully.</p>
    </div>

    <form class="login-form" method="post" th:action="@{/login}">
        <!-- Add CSRF token if you've re-enabled CSRF protection -->
        <input th:name="${_csrf.parameterName}" th:value="${_csrf.token}" type="hidden"/>

        <h2>Welcome Back</h2>
        <div class="form-group">
            <input class="form-input" name="username" placeholder="Username or Email" required type="text">
        </div>
        <div class="form-group">
            <input class="form-input" name="password" placeholder="Password" required type="password">
        </div>
        <button class="login-button" type="submit">Login</button>
        <div class="form-footer">
            <a class="register-link" href="/register">Don't have an account? Register</a>
            <a class="forgot-password-link" href="/forgot-password">Forgot Password?</a>
        </div>
    </form>
</div>
</body>
</html>
