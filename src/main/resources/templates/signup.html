<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Signup</title>
</head>
<body>
<div class="container">
    <div class="center">
        <h1>Signup Form</h1>

        <!-- Success Alert -->
        <div class="alert success" role="alert" th:if="${param.success}">
            <strong>Account created successfully</strong>
            <div class="alert-actions">
                <a class="button primary" href="/login">Login</a>
                <button class="button" onclick="this.closest('.alert').style.display='none'">Close</button>
            </div>
        </div>

        <!-- Global Error Alert -->
        <div class="alert error" role="alert" th:if="${#fields.hasGlobalErrors()}">
            <strong>Error during account creation</strong>
            <ul>
                <li th:each="err : ${#fields.globalErrors()}" th:text="${err}"></li>
            </ul>
            <button class="button" onclick="this.closest('.alert').style.display='none'">Close</button>
        </div>

        <!-- Registration Form -->
        <form method="post" th:action="@{/register}" th:object="${registrationDto}">
            <!-- CSRF Token -->
            <input th:name="${_csrf.parameterName}" th:value="${_csrf.token}" type="hidden">

            <!-- Username Field -->
            <div class="input-block">
                <label for="username">Username</label>
                <div class="input-row">
                    <input id="username" th:errorclass="input-error" th:field="*{username}"
                           type="text">
                    <div class="error-message" th:if="${#fields.hasErrors('username')}">
                        <p th:each="err : ${#fields.errors('username')}" th:text="${err}"></p>
                    </div>
                </div>
            </div>

            <!-- Email Field -->
            <div class="input-block">
                <label for="email">Email</label>
                <div class="input-row">
                    <input id="email" th:errorclass="input-error" th:field="*{email}"
                           type="email">
                    <div class="error-message" th:if="${#fields.hasErrors('email')}">
                        <p th:each="err : ${#fields.errors('email')}" th:text="${err}"></p>
                    </div>
                </div>
            </div>

            <!-- First Name Field -->
            <div class="input-block">
                <label for="firstname">First Name</label>
                <div class="input-row">
                    <input id="firstname" th:errorclass="input-error" th:field="*{firstname}"
                           type="text">
                    <div class="error-message" th:if="${#fields.hasErrors('firstname')}">
                        <p th:each="err : ${#fields.errors('firstname')}" th:text="${err}"></p>
                    </div>
                </div>
            </div>

            <!-- Last Name Field -->
            <div class="input-block">
                <label for="lastname">Last Name</label>
                <div class="input-row">
                    <input id="lastname" th:errorclass="input-error" th:field="*{lastname}"
                           type="text">
                    <div class="error-message" th:if="${#fields.hasErrors('lastname')}">
                        <p th:each="err : ${#fields.errors('lastname')}" th:text="${err}"></p>
                    </div>
                </div>
            </div>

            <!-- Password Field -->
            <div class="input-block">
                <label for="password">Password</label>
                <div class="input-row">
                    <input id="password" th:errorclass="input-error" th:field="*{password}"
                           type="password">
                    <div class="error-message" th:if="${#fields.hasErrors('password')}">
                        <p th:each="err : ${#fields.errors('password')}" th:text="${err}"></p>
                    </div>
                </div>
            </div>

            <!-- Confirm Password Field -->
            <div class="input-block">
                <label for="confirm-password">Confirm Password</label>
                <div class="input-row">
                    <input id="confirm-password" th:errorclass="input-error" th:field="*{confirmPassword}"
                           type="password">
                    <div class="error-message" th:if="${#fields.hasErrors('confirmPassword')}">
                        <p th:each="err : ${#fields.errors('confirmPassword')}" th:text="${err}"></p>
                    </div>
                </div>
            </div>

            <!-- Form Actions -->
            <div class="form-actions">
                <button class="button primary" type="submit">Submit</button>
                <a class="button secondary" href="/">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
