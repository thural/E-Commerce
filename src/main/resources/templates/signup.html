<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Signup</title>
</head>
<body>
<div class="container">
    <div class="center">
        <h1>Signup Form</h1>

        <!-- Success Alert -->
        <div class="alert success" role="alert" th:if="${param.success}">
            <strong>Account created successfully</strong>
            <div class="alert-actions">
                <a class="button primary" th:href="@{/login}">Login</a>
                <button class="button" onclick="this.closest('.alert').style.display='none'">Close</button>
            </div>
        </div>

        <!-- Global Error Alert -->
        <div th:replace="~{fragments/form :: global-errors}"></div>

        <!-- Registration Form -->
        <form method="post" th:action="@{/register}" th:object="${registrationDto}">
            <!-- CSRF Token -->
            <input th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" type="hidden">

            <!-- Username Field -->
            <div th:replace="~{fragments/form :: text-field(label='Username', field='username')}"></div>

            <!-- Email Field -->
            <div th:replace="~{fragments/form :: text-field(label='Email', field='email')}"></div>

            <!-- First Name Field -->
            <div th:replace="~{fragments/form :: text-field(label='First Name', field='firstname')}"></div>

            <!-- Last Name Field -->
            <div th:replace="~{fragments/form :: text-field(label='Last Name', field='lastname')}"></div>

            <!-- Password Field -->
            <div th:replace="~{fragments/form :: text-field(label='Password', field='password')}"></div>

            <!-- Confirm Password Field -->
            <div th:replace="~{fragments/form :: text-field(label='Confirm Password', field='confirmPassword')}"></div>

            <!-- Form Actions -->
            <div class="form-actions">
                <button class="button primary" type="submit">Submit</button>
                <a class="button secondary" th:href="@{/}">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
