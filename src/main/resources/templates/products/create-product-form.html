<!DOCTYPE html>
<html th:replace="~{layout :: layout(~{::title}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Product</title>
</head>
<body>
<main>
    <link rel="stylesheet" th:href="@{/css/create-product.css}">
    <link rel="stylesheet" th:href="@{/css/form.css}">
    <div class="form-container">
        <h2>Add New Product</h2>
        <form enctype="multipart/form-data"
              method="post"
              th:action="@{/products/create}"
              th:object="${productDto}">

            <!-- Global Errors - Moved inside form -->
            <div th:replace="~{fragments/form :: global-errors}"></div>

            <!-- Name field -->
            <div th:replace="~{fragments/form :: text-field(label='Name', field='name')}"></div>

            <!-- Category field -->
            <div th:replace="~{fragments/form :: select-field(label='Category', field='category', items=${categories})}"></div>

            <!-- Price field -->
            <div th:replace="~{fragments/form :: number-field(label='Price', field='price', step='0.01')}"></div>

            <!-- Description field -->
            <div th:replace="~{fragments/form :: textarea-field(label='Description', field='description', rows=4)}"></div>

            <!-- Image upload field -->
            <div th:replace="~{fragments/form :: file-field(label='Product Image', field='imageFile')}"></div>

            <!-- Form actions -->
            <div th:replace="~{fragments/form :: form-actions}"></div>
        </form>
    </div>
    <script th:src="@{/js/image-preview.js}"></script>
</main>
</body>
</html>
