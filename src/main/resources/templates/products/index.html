<!DOCTYPE html>
<html
        lang="en"
        th:replace="~{layout :: layout(~{::title}, ~{::section})}"
        xmlns:th="http://www.thymeleaf.org"
>
<head>
    <meta charset="UTF-8">
    <title>Products List</title>
    <link rel="stylesheet" th:href="@{/css/products.css}">
</head>
<body>
<section>
    <!-- Admin/Manager Special Actions -->
    <div th:replace="~{fragments/product-components :: product-admin-actions}"></div>

    <div class="products table" th:if="${products == null or products.isEmpty()}">
        <td colspan="8">No products found</td>
    </div>
    <!-- Product Table -->
    <table class="products table" th:unless="${products != null || products.isEmpty()}">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Brand</th>
            <th>Category</th>
            <th>Price</th>
            <th>Image</th>
            <th>Date</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="product : ${products}"
            th:replace="~{fragments/product-components :: product-card}"
        >
        </tr>
        </tbody>
    </table>
</section>
<!-- Optional: Page-specific JavaScript -->
<script th:src="@{/js/products.js}"></script>
</body>
</html>
