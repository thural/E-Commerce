<!DOCTYPE html>
<html
        lang="en"
        th:replace="~{layout :: layout(~{::title}, ~{::section})}"
        xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
        xmlns:th="http://www.thymeleaf.org"
>
<head>
    <meta charset="UTF-8">
    <title>Products List</title>
    <link rel="stylesheet" th:href="@{/css/products.css}">
</head>
<body>
<section>
    <!-- Add Product Button -->
    <form method="get" sec:authorize="hasAnyRole('ADMIN', 'MANAGER')"
          th:action="@{/products/create}">
        <div th:replace="~{fragments/components :: button('Add Product', '/products/create', 'button button-primary')}"></div>
    </form>

    <!-- Admin/Manager Special Actions -->
    <div th:replace="~{fragments/product-components :: product-admin-actions}"></div>

    <!-- Product Table -->
    <table class="products table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Brand</th>
            <th>Category</th>
            <th>Price</th>
            <th>Image</th>
            <th>Date</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="product : ${products}"
            th:replace="~{fragments/product-components :: product}">
        </tr>
        </tbody>
    </table>
</section>

<!-- Optional: Page-specific JavaScript -->
<script th:src="@{/js/products.js}"></script>
</body>
</html>
