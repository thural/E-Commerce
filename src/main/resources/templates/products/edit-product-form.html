<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title th:text="#{product.edit.title}">Edit Product</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="container">
    <div class="product-edit-form">
        <h1 th:text="#{product.edit.heading}">Edit Product</h1>

        <form
                enctype="multipart/form-data"
                method="post"
                novalidate="novalidate"
                th:action="@{/products/edit}"
                th:object="${productDto}"
        >
            <!-- ID Field (Read-only) -->
            <div th:replace="~{fragments :: readonly-id-field(
                label=#{product.id},
                field='id',
                helpText=#{product.id.help}
            )}"></div>

            <!-- Name Field -->
            <div th:replace="~{fragments :: input-field(
                label=#{product.name},
                field='name',
                type='text',
                options=null
            )}"></div>

            <!-- Category Field -->
            <div th:replace="~{fragments :: input-field(
                label=#{product.category},
                field='category',
                type='select',
                options=${{items:
                    T(com.example.ProductCategory).values().![
                        {value: this, label: this}
                    ]
                }}
            )}"></div>

            <!-- Price Field -->
            <div th:replace="~{fragments :: input-field(
                label=#{product.price},
                field='price',
                type='number',
                options=${{min: 0, step: '0.01'}}
            )}"></div>

            <!-- Description Field -->
            <div th:replace="~{fragments :: input-field(
                label=#{product.description},
                field='description',
                type='textarea',
                options=${{rows: 4}}
            )}"></div>

            <!-- Current Image -->
            <div th:replace="~{fragments :: image-preview(
                label=#{product.current.image},
                imageUrl=@{'/images/' + ${productDto.imageFileName}}
            )}"></div>

            <!-- Image Upload -->
            <div th:replace="~{fragments :: file-input-field(
                label=#{product.image.upload},
                field='imageFile'
            )}"></div>

            <!-- Action Buttons -->
            <div th:replace="~{fragments :: form-actions(
                submitLabel=#{button.submit},
                cancelLabel=#{button.cancel}
            )}"></div>
        </form>
    </div>
</div>
</body>
</html>
