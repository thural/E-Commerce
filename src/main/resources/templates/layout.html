<!DOCTYPE html>

<html
        lang="en" th:fragment="layout(title, content)"
        xmlns:th="http://www.thymeleaf.org"
>

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title th:replace="${title}">Default Title</title>
    <!-- Common CSS -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/container.css}">
    <!-- Additional page-specific CSS -->
    <th:block th:if="${content != null}">
        <th:block th:remove="tag" th:replace="${content} ? ~{:: link}"></th:block>
    </th:block>
</head>

<body>
<div class="main-container">
    <!-- Navbar Fragment -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Main Content Container -->
    <div class="custom-container">
        <!-- Page-specific content will be inserted here -->
        <th:block th:replace="${content}"></th:block>
    </div>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Common JavaScript -->
    <script th:src="@{/js/main.js}"></script>

    <!-- Additional page-specific scripts -->
    <th:block th:if="${content != null}">
        <th:block th:remove="tag" th:replace="${content} ? ~{:: script}"></th:block>
    </th:block>
</div>

</body>
</html>
