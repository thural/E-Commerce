<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register</title>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link rel="stylesheet" th:href="@{/static/css/register.css}">
</head>
<body>
<div class="register-container">
    <!-- Success Alert -->
    <div class="alert success" role="alert" th:if="${param.success}">
        <strong>Account created successfully</strong>
        <div class="alert-actions">
            <a class="button primary" href="/login">Login</a>
            <button class="button close-alert" onclick="this.closest('.alert').style.display='none'">Close</button>
        </div>
    </div>

    <form class="register-form" method="post" th:action="@{/register}" th:object="${registrationDto}">
        <h2>Create an Account</h2>

        <div class="form-group">
            <label for="email">Email</label>
            <input class="form-input" id="email" placeholder="Enter your email" th:field="*{email}" type="email"/>
            <span class="error-message" th:errors="*{email}" th:if="${#fields.hasErrors('email')}"></span>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input class="form-input" id="password" placeholder="Create a password" th:field="*{password}"
                   type="password"/>
            <span class="error-message" th:errors="*{password}" th:if="${#fields.hasErrors('password')}"></span>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input class="form-input" id="confirmPassword" placeholder="Confirm your password" th:field="*{confirmPassword}"
                   type="password"/>
            <span class="error-message" th:errors="*{confirmPassword}"
                  th:if="${#fields.hasErrors('confirmPassword')}"></span>
        </div>

        <button class="register-button" type="submit">Register</button>

        <div class="form-footer">
            <p>Already have an account? <a class="login-link" href="/login">Login</a></p>
        </div>
    </form>
</div>
</body>
</html>
