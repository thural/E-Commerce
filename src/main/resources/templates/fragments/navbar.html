<!DOCTYPE html>
<html xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
<!-- Navbar Fragment -->
<nav class="navbar" th:fragment="navbar">
    <div class="navbar-container">
        <!-- Logo or Brand -->
        <div class="navbar-brand">
            <a class="navbar-logo" th:href="@{/}">Shopping Cart</a>
        </div>

        <!-- Navigation Links -->
        <ul class="navbar-menu">
            <li class="navbar-item">
                <a class="navbar-link" th:href="@{/home}">Home</a>
            </li>
            <li class="navbar-item">
                <a class="navbar-link" th:href="@{/products}">Products</a>
            </li>
            <!-- Add more navigation items as needed -->
        </ul>

        <!-- User Account and Logout Section -->
        <div class="navbar-user">
            <!-- Show different content based on authentication status -->
            <div sec:authorize="isAuthenticated()">
                <!-- Username display -->
                <span class="username" sec:authentication="name">Username</span>

                <!-- Logout Form -->
                <form class="logout-form" method="post" th:action="@{/logout}">
                    <input th:name="${_csrf.parameterName}" th:value="${_csrf.token}" type="hidden"/>
                    <button class="logout-button" type="submit">
                        <i class="logout-icon">&#x2398;</i> Logout
                    </button>
                </form>
            </div>

            <!-- Login and Register links for unauthenticated users -->
            <div sec:authorize="!isAuthenticated()">
                <a class="login-link" th:href="@{/login}">Login</a>
                <a class="register-link" th:href="@{/register}">Register</a>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
