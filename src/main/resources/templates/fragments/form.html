<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Read-only ID Field Fragment -->
<div class="form-group" th:fragment="readonly-id-field (label, field, helpText)">
    <label th:for="${field}" th:text="${label}">ID</label>
    <input class="form-control"
           readonly
           th:aria-describedby="${field + '-help'}"
           th:id="${field}"
           th:value="*{__${field}__}"
           type="text">
    <small class="form-text text-muted"
           th:id="${field + '-help'}"
           th:text="${helpText}">Field help text</small>
</div>

<!-- Text Input Field Fragment -->
<div class="form-group" th:fragment="text-field (label, field)">
    <label th:for="${field}" th:text="${label}">Field Label</label>
    <input class="form-control"
           th:aria-describedby="${field + '-error'}"
           th:classappend="${#fields.hasErrors(field)} ? 'is-invalid' : ''"
           th:field="*{__${field}__}"
           th:id="${field}"
           type="text">
    <div class="invalid-feedback"
         th:errors="*{__${field}__}"
         th:id="${field + '-error'}"
         th:if="${#fields.hasErrors(field)}"></div>
</div>

<!-- Number Input Field Fragment -->
<div class="form-group" th:fragment="number-field (label, field, step)">
    <label th:for="${field}" th:text="${label}">Field Label</label>
    <input class="form-control"
           th:aria-describedby="${field + '-error'}"
           th:attr="step=${step ?: 1}"
           th:classappend="${#fields.hasErrors(field)} ? 'is-invalid' : ''"
           th:field="*{__${field}__}"
           th:id="${field}"
           type="number">
    <div class="invalid-feedback"
         th:errors="*{__${field}__}"
         th:id="${field + '-error'}"
         th:if="${#fields.hasErrors(field)}"></div>
</div>

<!-- Select Field Fragment -->
<div class="form-group" th:fragment="select-field (label, field, items)">
    <label th:for="${field}" th:text="${label}">Field Label</label>
    <select class="form-control"
            th:aria-describedby="${field + '-error'}"
            th:classappend="${#fields.hasErrors(field)} ? 'is-invalid' : ''"
            th:field="*{__${field}__}"
            th:id="${field}">
        <option th:each="item : ${items}"
                th:text="${item.toUpperCase()}"
                th:value="${item}">
        </option>
    </select>
    <div class="invalid-feedback"
         th:errors="*{__${field}__}"
         th:id="${field + '-error'}"
         th:if="${#fields.hasErrors(field)}"></div>
</div>

<!-- Textarea Field Fragment -->
<div class="form-group" th:fragment="textarea-field (label, field, rows)">
    <label th:for="${field}" th:text="${label}">Field Label</label>
    <textarea class="form-control"
              th:aria-describedby="${field + '-error'}"
              th:attr="rows=${rows ?: 4}"
              th:classappend="${#fields.hasErrors(field)} ? 'is-invalid' : ''"
              th:field="*{__${field}__}"
              th:id="${field}">
    </textarea>
    <div class="invalid-feedback"
         th:errors="*{__${field}__}"
         th:id="${field + '-error'}"
         th:if="${#fields.hasErrors(field)}"></div>
</div>

<!-- File Input Fragment -->
<div class="form-group" th:fragment="file-field (label, field)">
    <label th:for="${field}" th:text="${label}">Upload File</label>
    <input class="form-control-file"
           th:aria-describedby="${field + '-error'}"
           th:classappend="${#fields.hasErrors(field)} ? 'is-invalid' : ''"
           th:field="*{__${field}__}"
           th:id="${field}"
           type="file">
    <div class="invalid-feedback"
         th:errors="*{__${field}__}"
         th:id="${field + '-error'}"
         th:if="${#fields.hasErrors(field)}"></div>
</div>

<!-- Form Actions Fragment -->
<div class="form-actions" th:fragment="form-actions">
    <button class="button primary" type="submit">Submit</button>
    <button class="button outline" type="reset">Cancel</button>
</div>

<!-- Global Errors Fragment -->
<div class="alert alert-danger"
     th:fragment="global-errors"
     th:if="${#fields.hasGlobalErrors()}">
    <ul class="mb-0">
        <li th:each="err : ${#fields.globalErrors()}"
            th:text="${err}">
            Global Error Message
        </li>
    </ul>
</div>
</body>
</html>
