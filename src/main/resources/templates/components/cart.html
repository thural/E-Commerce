    <link rel="stylesheet" th:href="@{/css/cart.css}">


    <div class="cart-btn cart-toggle">
        <img alt="cart" th:src="@{/icons/cart.svg}">
        <div class="cart-badge"
             th:text="${session.cart != null ? #lists.size(session.cart.cartItems) : 0}">0
        </div>
    </div>


    <div class="cart-bckg" onclick="UIController.toggleCart()"></div>


    <div class="cart">
        <h3>Shopping Cart</h3>
        <div class="items">
            <div th:each="item : ${session.cart != null ? session.cart.cartItems : {}}">
                <th:block th:replace="fragments/cartItem :: itemFragment(item=${item})"></th:block>
            </div>
        </div>
        <h3>total: $<span id="totalPrice"
                          th:text="${session.cart != null ? session.cart.totalPrice : '0.00'}">0.00</span>
        </h3>
        <div class="buttons">
            <button onclick="CartController.checkout()">checkout</button>
            <button onclick="UIController.toggleCart()">close</button>
        </div>
    </div>


    <script th:src="@{/js/ui.js}" type="module"></script>
    <script th:src="@{/js/api.js}" type="module"></script>
    <script th:src="@{/js/cart.js}" type="module"></script>
    <script th:src="@{/js/product-card.js}" type="module"></script>
