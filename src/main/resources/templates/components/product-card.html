<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Product Card Template -->
<div class="product-card" th:fragment="product-card(product)" th:id="${product.id}">
    <link rel="stylesheet" th:href="@{/css/product-card.css}">
    <div class="image-container">
        <img alt="Product Image"
             th:src="${product.imageFileName != null} ? @{'/public/images/' + ${product.imageFileName}} : @{'/public/images/default-product.png'}">
    </div>
    <div class="name">
        <h3 th:text="${product.name}"></h3>
    </div>
    <div class="add">
        <p>$<span th:text="${product.price}"></span></p>
        <button class="add-to-cart-btn"
                th:data-product-id="${product.id}"
                th:data-product-name="${product.name}"
                th:data-product-price="${product.price}">
            add to cart
        </button>
    </div>
    <!-- Include JavaScript at the end of body -->
    <script th:src="@{/js/product-card.js}" type="module"></script>
</div>
</body>
</html>
