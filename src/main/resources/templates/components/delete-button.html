<!-- Delete Button Fragment with Confirmation -->
<div th:fragment="delete-button(id)"
     xmlns:th="http://www.thymeleaf.org">
    >
    <button
            class="btn btn-danger"
            onclick="return confirm('Are you sure you want to delete this item?');"
            th:onclick="|return confirm('Are you sure you want to delete this item?') && window.location.href='@{products/delete(id=${id})}'|">
        Delete
    </button>
</div>
