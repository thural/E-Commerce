<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="hamburger-menu(content)">
    <link rel="stylesheet" th:href="@{/css/hamburger-menu.css}">

    <button aria-label="Menu" class="hamburger-button">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <!-- Menu Overlay -->
    <div class="menu-overlay"></div>

    <nav class="hamburger-nav">
        <div class="menu-header">
            <button aria-label="Close menu" class="close-menu">&times;</button>
        </div>
        <div class="menu-content">
            <th:block th:replace="${content}"/>
        </div>
    </nav>

    <script th:src="@{/js/hamburger-menu.js}" type="module"></script>
</div>
</body>
</html>
